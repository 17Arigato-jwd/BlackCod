<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackCod Installer Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff0000, #990000);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.3);
            /* 3s duration: fits into 6s loop */
            animation: float 3s ease-in-out infinite;
        }

        .fish-icon {
            width: 60px;
            height: 60px;
            stroke: white;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* 1.5s duration: fits into 6s loop (4 cycles) */
            animation: pulse 1.5s ease-in-out infinite;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.5s forwards;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.7s forwards;
        }

        .progress-container {
            width: 300px;
            height: 6px;
            background: #272727;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.9s forwards;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #ff0000;
            border-radius: 3px;
            /* 2s duration: fits into 6s loop (3 cycles) */
            animation: progress 2s ease-in-out infinite;
            box-shadow: 0 0 20px #ff0000;
        }

        .status-text {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            font-family: monospace;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 1.1s forwards;
            min-height: 1.5em; /* reserve space to prevent jitter */
        }

        /* Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: rise 10s infinite linear;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes progress {
            0% { width: 0%; left: 0; }
            50% { width: 70%; left: 0; }
            100% { width: 0%; left: 100%; }
        }

        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo-container">
            <svg class="fish-icon" viewBox="0 0 24 24">
                <path d="M6.5 12c.94-3.46 4.96-6 8.5-6 3.54 0 6.5 3 6.5 6s-2.96 6-6.5 6c-3.54 0-7.56-2.54-8.5-6Z" />
                <path d="M18 12v.5" />
                <path d="M16 17.93a9.77 9.77 0 0 1 0-11.86" />
                <path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33" />
                <path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4" />
                <path d="M10.46 16.74C10.2 18.12 9.17 19.76 8 21h5.8a2 2 0 0 0 1.98-1.67l.23-1.4" />
            </svg>
        </div>

        <div class="title">BlackCod</div>
        <div class="subtitle">VCHS Studios</div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="status-text" id="status">Installing updates...</div>
    </div>

    <script>
        // Generate Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 50 + 10;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            p.style.animationDuration = `${Math.random() * 10 + 10}s`;
            particlesContainer.appendChild(p);
        }

        // Loopable Status Texts (No start or end states, just continuous working states)
        const statuses = [
            "Unpacking assets...",
            "Configuring local database...",
            "Optimizing video engine...",
        ];
        
        let step = 0;
        const statusEl = document.getElementById('status');
        
        // Cycle every 2000ms. 3 items * 2s = 6s total loop time.
        // Matches sync with:
        // - Float (3s): 2 cycles
        // - Pulse (1.5s): 4 cycles
        // - Progress (2s): 3 cycles
        
        setInterval(() => {
            step = (step + 1) % statuses.length;
            
            // Fade out
            statusEl.style.transition = 'opacity 0.2s';
            statusEl.style.opacity = 0;
            
            setTimeout(() => {
                statusEl.textContent = statuses[step];
                // Fade in
                statusEl.style.opacity = 1;
            }, 200);
            
        }, 2000);
    </script>
</body>
</html>
